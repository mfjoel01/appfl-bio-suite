    n: 50000
    composition:
      EUR: 30000
      AFR: 7500
      AMR: 7500
      EAS: 2500
      CSA: 2500
    dominant: EUR
  covenant:
    n: 50000
    composition:
      AFR: 47500
      EUR: 1500
      CSA: 1000
    dominant: AFR
  mbzuai:
    n: 50000
    composition:
      MID: 25000
      CSA: 15000
