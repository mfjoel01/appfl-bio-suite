# =============================================================================
# website/federation.yaml -- the federation drawn on the project site's network map
# =============================================================================
#
# The institutions on the site's map are the suite's real partners, as of 2026-09. What
# is published about them is deliberately thin: institution, country, a representative
# city and coordinate, which project they are on, and how far along the partnership is.
# No person's name and no email address appears here or in website/partners.json, and
# scripts/check_site_preview.py fails the build if one does.
#
# Endpoint UUIDs, paths and scheduler settings below are placeholders. The map only needs
# a site to belong to one enabled experiment to draw it; nothing is ever run from this
# file.
#
# WHY TWO FILES. This one holds the coordinator's own site and the sites that participate
# in an experiment the suite actually runs (the viewer needs at least one to draw
# anything). Every other partner -- projects outside the suite, or partnerships still
# being set up -- is presentation data and lives in website/partners.json, which also
# carries each partner's stage and, for Argonne, which experiments it is on.
#
#     scripts/build_site.sh local/site-preview
#
# WHY IT IS NOT local/federation.yaml. That one carries partner contact details and real
# endpoint identifiers. check_site_preview.py fails the site build if the published map
# was assembled from anything but this file or the example.
#
# =============================================================================

schema_version: 1

coordinator:
  identity: coordinator@example.org
  identity_id: 00000000-1111-2222-3333-444444444444
  organization: Argonne National Laboratory
  contact: coordinator@example.org
  site: anl
  endpoint:
    name: coordinator-ep
    uuid: aaaaaaaa-0000-0000-0000-000000000001
    scheduler: pbspro
    queue: debug
    account: EXAMPLE-ALLOC
  host_check: "^example-login-\\d+"
  host_check_enforce: false

sites:
  - id: anl
    name: Argonne National Laboratory
    country: United States
    location: {lat: 41.7183, lng: -87.9788, city: Lemont}
    scheduler: pbspro
    queue: debug
    account: EXAMPLE-ALLOC

  - id: cdac
    name: Centre for Development of Advanced Computing
    country: India
    location: {lat: 18.534874, lng: 73.808688, city: Pune}
    scheduler: slurm
    partition: compute
    account: fedlearn
    conda_module: anaconda3
    interface: null

experiments:
  flamby-heart-disease:
    enabled: true
    service_account: flamby_svc
    endpoint_name: flamby-ep
    dataset: HeartDisease
    num_clients: 4
    rounds: 5
    client_weights_mode: equal
    sites:
      - site: cdac
        client_id: Site4
        endpoint_uuid: bbbbbbbb-0000-0000-0000-000000000004
        center: 3
        output_dir: /home/flamby_svc/outputs
        expected_train_samples: 85
