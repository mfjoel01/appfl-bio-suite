# -----------------------------------------------------------------------------
# WHAT EACH SITE IS DOING
# -----------------------------------------------------------------------------
# Memberships overlap on purpose. Filtering the viewer to one experiment should visibly
# redraw the map rather than dim a few markers, which only reads if the three
# federations are genuinely different sets.
experiments:

  # Four sites, because Fed-Heart-Disease has four natural collection centres and each
  # site trains on a distinct one.
  flamby-heart-disease:
    enabled: true
    service_account: flamby_svc
    endpoint_name: flamby-ep
    dataset: HeartDisease
    num_clients: 4
    rounds: 5
    client_weights_mode: equal
    sites:
      - site: site-north
        client_id: Site1
        endpoint_uuid: bbbbbbbb-0000-0000-0000-000000000001
        center: 0
        output_dir: /home/flamby_svc/outputs
        expected_train_samples: 199
      - site: site-south
        client_id: Site2
        endpoint_uuid: bbbbbbbb-0000-0000-0000-000000000002
        center: 1
        output_dir: /scratch/flamby_svc/outputs
        expected_train_samples: 172
      - site: site-east
        client_id: Site3
        endpoint_uuid: bbbbbbbb-0000-0000-0000-000000000003
        center: 2
        output_dir: /work/flamby_svc/outputs
        expected_train_samples: 30
      - site: site-highland
        client_id: Site4
        endpoint_uuid: bbbbbbbb-0000-0000-0000-000000000004
        center: 3
        output_dir: /home/flamby_svc/outputs
        expected_train_samples: 85

  gwas:
    enabled: true
    service_account: gwas_svc
    endpoint_name: gwas-ep
    simulation_scenario: three-site-skewed
    variant_scaling: 1.0
    hit_p_threshold: 5.0e-8
    sites:
      - site: site-north
        client_id: Site1
        endpoint_uuid: cccccccc-0000-0000-0000-000000000001
        data_dir: /home/gwas_svc/data/site1
        output_dir: /home/gwas_svc/outputs
        expected_samples: 18032
      - site: site-south
