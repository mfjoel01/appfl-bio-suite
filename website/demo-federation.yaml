# =============================================================================
# demo-federation.yaml -- the federation drawn on the project site's network map
# =============================================================================
#
# EVERY INSTITUTION, PERSON, COORDINATE, ENDPOINT AND SAMPLE COUNT HERE IS INVENTED.
# There is no such federation. This file exists so that
# https://mfjoel01.github.io/appfl-bio-suite/network.html has something worth looking
# at: twenty sites on six continents, three experiments with different and overlapping
# memberships, and a spread of schedulers -- which is what the viewer is for and what
# three sites cannot show.
#
# WHY THIS IS NOT federation.yaml.example. That file is what a coordinator copies to
# local/federation.yaml to start their own federation, and it is heavily commented
# because its job is to be read line by line. Twenty sites would make it worse at that
# job: nineteen of them would be the first thing a new coordinator deletes. So the
# teaching example stays at three sites, and the showcase lives here.
#
# WHY IT IS NOT local/federation.yaml EITHER. That one names real partners and carries
# their contact details. scripts/check_site_preview.py fails the site build if the
# published map was assembled from anything but this file or the example, so the
# distinction is enforced rather than remembered.
#
#     scripts/build_site.sh local/site-preview     # uses this file
#
# =============================================================================

schema_version: 1

coordinator:
  identity: a.researcher@example-university.edu
  identity_id: 00000000-1111-2222-3333-444444444444
  organization: Example University Institute for Computational Health
  contact: a.researcher@example-university.edu
  location:
    lat: 41.8781
    lng: -87.6298
    city: Chicago
  endpoint:
    name: example-coordinator-ep
    uuid: aaaaaaaa-0000-0000-0000-000000000001
    scheduler: pbspro
    queue: debug
    account: EXAMPLE-ALLOC
  host_check: "^example-login-\\d+"
  host_check_enforce: false


